# Staging: Postgres + minimales FastAPI (Health / Ready).
#
# Vorbereitung:
#   1. Kopiere staging.env.example nach .env im Ordner deploy/.
#   2. POSTGRES_PASSWORD und API_TOKEN_SECRET setzen (optional ADMIN_EMAIL + Login/Reset-Limits).
#   3. cd deploy && docker compose -f staging-compose.yml up -d
#
# API: http://localhost:8000/health  |  DB-Check: /ready
# Postgres nach außen: localhost:5433 (weicht von lokalem 5432 ab).

services:
  postgres_staging:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ahds}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?in_dotenv_setzen}"
      POSTGRES_DB: ${POSTGRES_DB:-ahds_staging}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ahds} -d ${POSTGRES_DB:-ahds_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api_staging:
    build: ./staging_api
    restart: unless-stopped
    ports:
      - "${STAGING_API_PORT:-8000}:8000"
    environment:
      APP_ENV: staging
      API_TOKEN_SECRET: "${API_TOKEN_SECRET:-ahds-dev-insecure-secret}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.org}"
      LOGIN_MAX_FEHLVERSUCHE: "${LOGIN_MAX_FEHLVERSUCHE:-5}"
      LOGIN_SPERRE_SEKUNDEN: "${LOGIN_SPERRE_SEKUNDEN:-900}"
      RESET_TOKEN_TTL_SEKUNDEN: "${RESET_TOKEN_TTL_SEKUNDEN:-1800}"
      PGHOST: postgres_staging
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-ahds}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-ahds_staging}
    depends_on:
      postgres_staging:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  pgdata_staging: